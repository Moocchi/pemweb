<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Bootstrap</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom styles */
        body {
            font-family: 'Arial', sans-serif;
        }
        .navbar {
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }
        .navbar-brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .nav-link {
            font-weight: 500;
            margin-left: 20px;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .hero-section {
            padding: 120px 0;
            background-color: #ffffff;
        }
        .hero-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .hero-subtitle {
            font-size: 28px;
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }
        .hero-description {
            font-size: 18px;
            color: #555;
            line-height: 1.8;
        }
        .profile-img-container {
            text-align: right;
        }
        .profile-img {
            width: 350px;
            height: 350px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .profile-detail {
            color: #666;
            margin-bottom: 5px;
            font-size: 18px;
        }
        .profile-btn {
            margin-top: 20px;
            padding: 10px 25px;
            font-weight: 500;
            border-radius: 50px;
        }
        .social-icons {
            margin: 20px 0 30px;
        }
        .social-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f0f0f0;
            color: #333;
            margin-right: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .social-icon:hover {
            background-color: #dc3545;
            color: white;
            transform: translateY(-3px);
        }
        .nav-hover:hover {
            color: red !important;
        }
        @media (max-width: 992px) {
            .hero-section {
                padding: 80px 0 40px;
            }
            .profile-img {
                width: 250px;
                height: 250px;
                margin-top: 40px;
            }
            .hero-title {
                font-size: 36px;
            }
            .hero-subtitle {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">PORTFOLIO</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link nav-hover" href="#">HOME</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-hover" href="#">ABOUT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-hover" href="#">SERVICES</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-hover" href="#">PORTFOLIO</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-hover" href="#">BLOG</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-hover" href="#">CONTACT</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section with Profile Image -->
    <section class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6">
                    <h1 class="hero-title">WELCOME!</h1>
                    <h2 class="hero-subtitle">I Am Muhammad Jarez</h2>
                    <p class="hero-description">Fakultas Ilmu Komputer</p>
                    <p class="text-muted mb-2">Teknik informatika</p>
                    
                    <!-- Social Media Icons -->
                    <div class="social-icons">
                        <a href="https://facebook.com/Muhammad.Jarez" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                        <a href="https://github.com/Moocchi" class="social-icon"><i class="fab fa-github"></i></a>
                        <a href="https://Instagram.com/jarez09" class="social-icon"><i class="fab fa-instagram"></i></a>
                    </div>
                    
                    <div class="mt-4">
                        <button type="button" class="btn btn-danger profile-btn" style="border-radius: 0;">Tangerang</button>
                        <button type="button" class="btn btn-outline-danger profile-btn ms-3" style="border-radius: 0;">09 Mei 2005</button>
                    </div>
                </div>
                <div class="col-lg-6 profile-img-container">
                    <img src="./assets/Phone theme.jpg" alt="Profile Picture" class="profile-img">
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
