server {
    listen 80;
    server_name localhost;

    # Root location untuk konten utama
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Location untuk folder latihan
    location /latihan {
        root /usr/share/nginx;
        try_files $uri $uri/ =404;
    }
}